name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # 디버그 빌드도 해야 #if DEBUG 코드(PreviewRenderer/DemoData/WebSessionProbe) 회귀를 잡는다.
      - name: Build (debug)
        run: swift build

      - name: Test
        run: swift test

      # 팝오버를 실제로 한 번 그려본다 (ImageRenderer/AppKit 경로의 런타임 크래시를 잡는다).
      - name: Popover render smoke
        run: |
          CTM_PREVIEW_OUT="$RUNNER_TEMP/preview.png" ./.build/debug/ClaudeMonitor
          test -s "$RUNNER_TEMP/preview.png"
          echo "✅ popover rendered"

      - name: Build (release)
        run: swift build -c release

      - name: Release binary must not contain dev-only code
        run: |
          if nm -a .build/release/ClaudeMonitor | grep -q -e DemoData -e PreviewRenderer; then
            echo "::error::release binary contains DEBUG-only types"; exit 1
          fi
          if strings -a .build/release/ClaudeMonitor | grep -q -e "데모" -e "Demo mode"; then
            echo "::error::release binary contains demo strings"; exit 1
          fi
          echo "✅ release binary contains no demo/preview code"

      - name: Assemble .app (smoke check)
        run: |
          ./scripts/package.sh 0.0.0-ci
          test -d "dist/ClaudeMonitor.app"
          test -f dist/ClaudeMonitor-v0.0.0-ci.dmg
          echo "✅ app bundle & dmg produced"
